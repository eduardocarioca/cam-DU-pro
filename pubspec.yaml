name: camdu_pro
description: "Aplicativo de monitoramento inteligente camDu Pro (RTSP/ONVIF, PTZ, Gravação, Detecção e Nuvem)"
publish_to: 'none'

version: 3.0.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mobile_scanner: ^5.1.1
  shared_preferences: ^2.3.3
  path_provider: ^2.1.4
  media_kit: ^1.2.6
  media_kit_video: 1.2.5
  media_kit_libs_video: ^1.0.7

dependency_overrides:
  package_info_plus: 8.3.1
  wakelock_plus: 1.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
